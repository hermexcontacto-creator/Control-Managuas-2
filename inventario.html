<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistemas Managua - Inventario Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; -webkit-tap-highlight-color: transparent; padding-bottom: 90px; }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(15px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .item-enter { animation: slideInRight 0.3s ease-out forwards; opacity: 0; transform: translateX(15px); }
        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }
        
        /* Colores para la barra de navegación */
        .nav-active { color: #34d399; } /* Emerald 400 */
        .nav-inactive { color: #64748b; } /* Slate 500 */
    </style>
</head>
<body class="text-slate-200">

    <!-- Loader de Pantalla Completa -->
    <div id="loader-inventario" class="fixed inset-0 bg-[#0f172a] z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <svg class="animate-spin h-12 w-12 text-emerald-500 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><circle class="opacity-25" cx="12" cy="12" r="10"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <p class="text-emerald-400 font-bold tracking-[0.2em] text-xs uppercase animate-pulse">Cargando Sistema...</p>
    </div>

    <!-- Header Fijo -->
    <header class="fixed top-0 left-0 w-full z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <a href="index.html" class="bg-slate-800 text-white p-2 rounded-full shadow-md hover:bg-slate-700 transition-all border border-slate-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <h1 class="text-lg font-black text-white tracking-tight" id="header-title">Stock Actual</h1>
        <div class="w-9"></div> <!-- Espaciador para centrar -->
    </header>

    <div class="max-w-md mx-auto pt-20 px-4">
        
        <!-- ================= SECCIÓN 1: STOCK (LISTA) ================= -->
        <section id="sec-stock" class="fade-in-up space-y-4">
            <div class="flex justify-between items-center mb-2 px-1">
                <p class="text-slate-400 text-sm">Control de existencias</p>
                <button onclick="cargarInventario()" class="text-slate-400 hover:text-emerald-400 transition-colors p-2 bg-slate-800 rounded-lg shadow border border-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
            <div id="lista-inventario" class="space-y-3">
                <!-- Se inyecta por JS -->
            </div>
        </section>

        <!-- ================= SECCIÓN 2: HISTORIAL AGRUPADO ================= -->
        <section id="sec-historial" class="fade-in-up hidden space-y-4">
            <div class="flex justify-between items-center mb-2 px-1">
                <p class="text-slate-400 text-sm">Movimientos por Fecha</p>
            </div>
            <div id="lista-historial" class="space-y-1">
                <!-- Se inyecta por JS -->
            </div>
        </section>
    </div>

    <!-- Barra de Navegación Inferior (Ahora solo 2 botones, 50% / 50%) -->
    <nav class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-between z-40 shadow-[0_-10px_20px_rgba(0,0,0,0.3)] pb-safe">
        <button onclick="cambiarTab('stock', this)" class="nav-btn nav-active flex flex-col items-center justify-center py-3 w-1/2 transition-colors border-r border-slate-800">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            <span class="text-[10px] font-bold uppercase tracking-wider">Stock</span>
        </button>
        <button onclick="cambiarTab('historial', this)" class="nav-btn nav-inactive flex flex-col items-center justify-center py-3 w-1/2 transition-colors">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] font-bold uppercase tracking-wider">Historial</span>
        </button>
    </nav>

    <!-- Modal para ➕ ENTRADA (Suma Manual) -->
    <div id="modal-movimiento" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-3xl p-6 w-full max-w-xs border border-slate-700 shadow-2xl relative fade-in-up">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            
            <h3 class="text-xl font-black text-emerald-400 mb-1 uppercase tracking-wider flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11l5-5m0 0l5 5m-5-5v12"></path></svg>
                Ingresar Stock
            </h3>
            <p class="text-xs text-slate-400 mb-4 font-mono">Producto: <span id="modal-id" class="text-white font-bold"></span></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Cantidad a sumar</label>
                    <input type="number" id="modal-cant" placeholder="Ej: 50" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white font-black text-2xl text-center focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Observación / Proveedor (Opcional)</label>
                    <input type="text" id="modal-obs" placeholder="Compra a proveedor X..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                
                <button onclick="procesarMovimiento()" id="btnMovimiento" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all text-sm uppercase tracking-wide mt-2">
                    Confirmar Ingreso
                </button>
            </div>
        </div>
    </div>

    <!-- Alerta Flotante Nativa Personalizada -->
    <div id="custom-alert" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div id="alert-card" class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl border-b-4 transform transition-all scale-95 duration-100">
            <div id="alert-icon" class="text-4xl mb-2 animate-bounce">✅</div>
            <h3 id="alert-title" class="text-lg font-black text-slate-800 tracking-tight mb-1">Título</h3>
            <p id="alert-msg" class="text-xs text-slate-500 mb-5 leading-relaxed">Mensaje descriptivo del estado.</p>
            <button id="alert-btn" onclick="closeCustomAlert()" class="w-full py-3 text-white font-black rounded-xl transition-all shadow-md active:translate-y-0.5 uppercase tracking-wider text-xs">Aceptar</button>
        </div>
    </div>

    <script>
        const TOKEN = "Managua2026_Seguro_FirmaX";
        const API_URL = "https://script.google.com/macros/s/AKfycbzTDmhdsUSpCS0tVZuzbAa1QCFyZbQhjkZ74GBpm1BAW1gx7zkoO1G2njA--rH2Kbrf/exec"; 

        window.addEventListener('DOMContentLoaded', cargarInventario);

        // --- SISTEMA DE NAVEGACIÓN ---
        function cambiarTab(tab, btnElement) {
            // Estilos de botones de la barra inferior
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('nav-active');
                btn.classList.add('nav-inactive');
            });
            btnElement.classList.remove('nav-inactive');
            btnElement.classList.add('nav-active');

            // Ocultar todas las secciones
            document.getElementById('sec-stock').classList.add('hidden');
            document.getElementById('sec-historial').classList.add('hidden');

            // Mostrar activa y cambiar el header
            const titulo = document.getElementById('header-title');
            if (tab === 'stock') {
                document.getElementById('sec-stock').classList.remove('hidden');
                titulo.innerText = "Stock Actual";
                cargarInventario(false); // false = no mostrar loader pantalla completa de nuevo
            } else if (tab === 'historial') {
                document.getElementById('sec-historial').classList.remove('hidden');
                titulo.innerText = "Historial de Movimientos";
                cargarHistorial();
            }
        }

        // --- ALERTAS PERSONALIZADAS ---
        function mostrarAlertaCustom(icono, titulo, mensaje, tipo = 'success') {
            const modal = document.getElementById('custom-alert');
            const elIcono = document.getElementById('alert-icon');
            const elTitulo = document.getElementById('alert-title');
            const elMensaje = document.getElementById('alert-msg');
            const elCard = document.getElementById('alert-card');
            const elBtn = document.getElementById('alert-btn');

            elIcono.innerText = icono;
            elTitulo.innerText = titulo;
            elMensaje.innerText = mensaje;

            elCard.className = "bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl border-b-4 transform transition-all";
            elBtn.className = "w-full py-3 text-white font-black rounded-xl transition-all shadow-md active:translate-y-0.5 uppercase tracking-wider text-xs";

            if (tipo === 'success') {
                elCard.classList.add('border-emerald-500');
                elBtn.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'shadow-emerald-200');
            } else if (tipo === 'error') {
                elCard.classList.add('border-rose-500');
                elBtn.classList.add('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-200');
            } else {
                elCard.classList.add('border-amber-500');
                elBtn.classList.add('bg-amber-500', 'hover:bg-amber-600', 'shadow-amber-200');
            }

            modal.classList.remove('hidden');
        }

        function closeCustomAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        // --- 1. CARGAR INVENTARIO (STOCK ACTUAL) ---
        async function cargarInventario(mostrarLoaderFull = true) {
            const contenedor = document.getElementById('lista-inventario');
            const loader = document.getElementById('loader-inventario');
            
            if(mostrarLoaderFull && loader) loader.classList.remove('hidden');
            if(!mostrarLoaderFull) contenedor.innerHTML = '<p class="text-center text-slate-500 text-sm py-8 animate-pulse">Actualizando stock...</p>';

            try {
                const response = await fetch(`${API_URL}?token=${TOKEN}&action=getInventario`);
                const data = await response.json();
                
                contenedor.innerHTML = '';
                
                if(data.length === 0 || data.status === "Error") {
                    contenedor.innerHTML = '<p class="text-center text-slate-500 text-sm py-4">No hay insumos registrados aún.</p>';
                    return;
                }

                data.forEach((item, index) => {
                    const isLowStock = item.stockActual <= item.stockMinimo;
                    const stockColor = isLowStock ? 'text-rose-400 font-black' : 'text-emerald-400 font-bold';
                    const bgCard = isLowStock ? 'bg-rose-950/20 border-rose-500/30' : 'glass-card';
                    const statusIcon = isLowStock ? '⚠️' : '✅';

                    const htmlCard = `
                        <div class="${bgCard} rounded-2xl p-4 flex flex-col item-enter" style="animation-delay: ${index * 50}ms">
                            <div class="flex justify-between items-center mb-3">
                                <div>
                                    <h3 class="text-white font-bold text-sm mb-1">${item.insumo}</h3>
                                    <span class="text-[10px] text-slate-500 font-mono uppercase bg-slate-900 px-2 py-0.5 rounded-md border border-slate-700">ID: ${item.id}</span>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl ${stockColor}">${item.stockActual} <span class="text-xs text-slate-400 font-normal">${item.unidad}</span></div>
                                    <div class="text-[10px] text-slate-400 mt-1">${statusIcon} Mínimo: ${item.stockMinimo}</div>
                                </div>
                            </div>
                            <button onclick="abrirModalEntrada('${item.id}')" class="w-full bg-slate-900 border border-emerald-900/50 text-emerald-400 hover:bg-emerald-900/30 rounded-xl py-2.5 text-xs font-black transition-colors flex justify-center items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                INGRESAR STOCK
                            </button>
                        </div>
                    `;
                    contenedor.insertAdjacentHTML('beforeend', htmlCard);
                });

            } catch (error) {
                contenedor.innerHTML = '<p class="text-center text-rose-500 text-sm py-4">Error de conexión al cargar datos.</p>';
            } finally {
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.classList.add('hidden'); loader.style.opacity = '1'; }, 500);
                }
            }
        }

        // --- 2. GESTIÓN DEL MODAL PARA SUMAR STOCK ---
        function abrirModalEntrada(id) {
            document.getElementById('modal-id').innerText = id;
            document.getElementById('modal-cant').value = '';
            document.getElementById('modal-obs').value = '';
            document.getElementById('modal-movimiento').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-movimiento').classList.add('hidden');
        }

        function procesarMovimiento() {
            const id = document.getElementById('modal-id').innerText;
            const cant = document.getElementById('modal-cant').value;
            const obs = document.getElementById('modal-obs').value || 'Ingreso manual al inventario';

            if(!cant || cant <= 0) {
                mostrarAlertaCustom("⚠️", "Dato Inválido", "Ingresa una cantidad mayor a 0", "warning");
                return;
            }

            const btn = document.getElementById('btnMovimiento');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 mr-2 text-white inline" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Procesando...`;
            btn.disabled = true;

            const payload = { 
                token: TOKEN, 
                action: "movimientoInventario", 
                idInsumo: id, 
                tipo: "ENTRADA", 
                cantidad: cant, 
                observacion: obs 
            };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                cerrarModal();
                cargarInventario(false); 
                mostrarAlertaCustom("✅", "¡Stock Actualizado!", `Se sumaron ${cant} al producto ${id}.`, "success");
                btn.innerHTML = txtOriginal; btn.disabled = false;
            }).catch(e => {
                cerrarModal(); btn.innerHTML = txtOriginal; btn.disabled = false;
                mostrarAlertaCustom("❌", "Error", "Fallo de conexión al servidor.", "error");
            });
        }

        // --- 3. CARGAR HISTORIAL (AGRUPADO POR FECHAS) ---
        async function cargarHistorial() {
            const contenedor = document.getElementById('lista-historial');
            contenedor.innerHTML = '<p class="text-center text-slate-500 text-sm py-8 animate-pulse">Buscando movimientos...</p>';
            
            try {
                const res = await fetch(`${API_URL}?token=${TOKEN}&action=getHistorial`);
                const data = await res.json();
                contenedor.innerHTML = '';
                
                if(!data || data.length === 0) {
                    contenedor.innerHTML = '<p class="text-center text-slate-500 text-sm py-4">No hay historial de movimientos.</p>';
                    return;
                }

                // 3.1 Agrupar los datos por Fecha (día)
                const movimientosPorFecha = {};
                
                data.forEach(item => {
                    const fechaObj = new Date(item.fecha);
                    // Formato de fecha para el título (ej: "Lunes, 02 de Sep")
                    const fechaLegible = fechaObj.toLocaleDateString('es-VE', { weekday: 'long', day: '2-digit', month: 'short' }); 
                    
                    if (!movimientosPorFecha[fechaLegible]) {
                        movimientosPorFecha[fechaLegible] = [];
                    }
                    movimientosPorFecha[fechaLegible].push(item);
                });

                // 3.2 Generar el HTML de los Acordeones (Fechas)
                Object.keys(movimientosPorFecha).forEach((fecha, index) => {
                    const movimientos = movimientosPorFecha[fecha];
                    const idAcordeon = 'fecha-' + index;

                    // Calcular totales del día
                    let entradasTotales = 0;
                    let salidasTotales = 0;
                    movimientos.forEach(m => {
                        if (m.tipo === "ENTRADA") entradasTotales += Number(m.cantidad);
                        else salidasTotales += Number(m.cantidad);
                    });

                    // Construir los items (hijos) dentro de la fecha
                    let movimientosHTML = '';
                    movimientos.forEach(item => {
                        const esEntrada = item.tipo === "ENTRADA";
                        const color = esEntrada ? 'text-emerald-400' : 'text-rose-400';
                        const borde = esEntrada ? 'border-emerald-500/50' : 'border-rose-500/50';
                        const signo = esEntrada ? '+' : '-';
                        const hora = new Date(item.fecha).toLocaleTimeString('es-VE', {hour: '2-digit', minute:'2-digit'});

                        movimientosHTML += `
                        <div class="bg-slate-900/60 border-l-2 ${borde} rounded-r-lg p-3 mb-2 flex justify-between items-center shadow-sm">
                            <div>
                                <div class="text-white font-bold text-xs uppercase">${item.id} <span class="text-[10px] font-normal text-slate-400 ml-2">🕒 ${hora}</span></div>
                                <div class="text-[11px] text-slate-400 italic mt-0.5">${item.observacion}</div>
                            </div>
                            <div class="${color} font-black text-lg bg-slate-950/80 px-2.5 py-1 rounded-md border border-slate-800">
                                ${signo}${item.cantidad}
                            </div>
                        </div>`;
                    });

                    // Construir el contenedor padre (La barra de la fecha clickeable)
                    const htmlCard = `
                        <div class="glass-card rounded-xl mb-3 overflow-hidden item-enter shadow-lg" style="animation-delay: ${index * 40}ms">
                            <button onclick="toggleAcordeon('${idAcordeon}')" class="w-full flex justify-between items-center p-4 text-left focus:outline-none hover:bg-slate-800/50 transition-colors">
                                <div>
                                    <h3 class="text-emerald-400 font-bold capitalize text-sm flex items-center tracking-wide">
                                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        ${fecha}
                                    </h3>
                                    <div class="text-[10px] text-slate-400 mt-1.5 flex space-x-3">
                                        <span class="bg-slate-900 px-2 py-0.5 rounded-md border border-emerald-900/30">Entradas: <b class="text-emerald-500">${entradasTotales}</b></span>
                                        <span class="bg-slate-900 px-2 py-0.5 rounded-md border border-rose-900/30">Salidas: <b class="text-rose-500">${salidasTotales}</b></span>
                                    </div>
                                </div>
                                <div class="bg-slate-800 p-1.5 rounded-full">
                                    <svg id="icon-${idAcordeon}" class="w-5 h-5 text-slate-300 transition-transform duration-300 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </button>
                            <!-- Contenido oculto por defecto -->
                            <div id="${idAcordeon}" class="hidden px-3 pb-3 border-t border-slate-700/50 pt-3 bg-slate-800/20">
                                ${movimientosHTML}
                            </div>
                        </div>
                    `;
                    contenedor.insertAdjacentHTML('beforeend', htmlCard);
                });

            } catch (err) { 
                contenedor.innerHTML = '<p class="text-rose-500 text-center py-4 text-sm">Error al cargar historial.</p>'; 
            }
        }

        // --- 4. FUNCIÓN PARA ABRIR/CERRAR FECHAS EN EL HISTORIAL ---
        function toggleAcordeon(id) {
            const contenido = document.getElementById(id);
            const icono = document.getElementById('icon-' + id);
            
            if (contenido.classList.contains('hidden')) {
                contenido.classList.remove('hidden');
                icono.classList.add('rotate-180');
            } else {
                contenido.classList.add('hidden');
                icono.classList.remove('rotate-180');
            }
        }
    </script>
</body>
</html>

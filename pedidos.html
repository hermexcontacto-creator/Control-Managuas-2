<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora POS - Agua Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: 'Nunito', sans-serif; user-select: none; overflow-x: hidden; touch-action: manipulation; }
        .toy-btn { @apply rounded-2xl flex flex-col items-center justify-center font-black transition-all duration-75 relative; border-bottom: 4px solid; background-color: white; border-color: #e2e8f0; color: #475569; }
        .toy-btn:active { transform: translateY(2px); border-bottom-width: 1px; margin-bottom: 1px; }
        .btn-blue-outline { border-color: #3b82f6; color: #2563eb; background-color: #eff6ff; }
        .btn-blue-solid { background-color: #3b82f6 !important; border-color: #1d4ed8 !important; color: white !important; }
        .btn-active { background-color: #3b82f6 !important; border-color: #1d4ed8 !important; color: white !important; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .btn-promo { border-color: #f59e0b; color: #d97706; background-color: #fffbeb; }
        .btn-promo-active { background-color: #f59e0b !important; border-color: #b45309 !important; color: white !important; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .btn-maint { border-color: #10b981; color: #059669; background-color: #ecfdf5; }
        .btn-maint-active { background-color: #10b981 !important; border-color: #047857 !important; color: white !important; }
        .btn-green-solid { background-color: #10b981 !important; border-color: #047857 !important; color: white !important; }
        .glass-display { @apply bg-white rounded-3xl p-3 text-center border-b-4 border-blue-100 shadow-sm mb-2; }
        
        #bcv-rate { @apply bg-slate-200 border-2 border-slate-300 rounded-lg px-2 py-1 text-center font-black text-emerald-600 outline-none w-32 text-base cursor-not-allowed; }
        
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        #checkout-modal, #tapa-modal, #new-customer-modal { backdrop-filter: blur(4px); }
    </style>
</head>
<body class="p-2 flex flex-col items-center min-h-screen relative">
    
    <!-- LOADER -->
    <div id="loader-pos" class="fixed inset-0 bg-[#f1f5f9]/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <svg class="animate-spin h-14 w-14 text-blue-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-blue-600 font-black tracking-widest text-[10px] uppercase animate-pulse">Sincronizando Base de Datos...</p>
    </div>
    
    <section class="w-full max-w-md mx-auto">
        <!-- CABECERA Y BOTONES DE PRODUCTOS -->
        <div class="sticky top-0 z-10 bg-[#f1f5f9] pb-2 pt-2">
            <div class="glass-display">
                <div class="flex justify-between items-start mb-1">
                    <div class="flex flex-col items-start relative">
                        <span id="tasa-label" class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Cargando Tasa...</span>
                        <div class="flex items-center gap-1">
                            <input type="text" id="bcv-rate" placeholder="00,00" readonly>
                        </div>
                    </div>
                    <div class="flex flex-col items-center">
                        <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Total Bs.</span>
                        <span id="total-display" class="text-3xl font-black text-slate-800 tracking-tighter">0,00</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[8px] font-black text-blue-400 uppercase">Cant.</span>
                        <span id="qty-display" class="text-2xl font-black text-blue-500">1</span>
                    </div>
                </div>
            </div>
            
            <a href="index.html" class="fixed top-3 left-3 z-40 bg-slate-800/80 text-white p-2 rounded-full shadow-lg backdrop-blur-sm hover:bg-slate-900 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            
            <div id="promo-banner" class="hidden bg-amber-100 border-2 border-amber-200 p-2 rounded-xl mb-2 text-center">
                <p id="promo-msg" class="text-[10px] font-black text-amber-700"></p>
            </div>

            <!-- BOTONES DE PRODUCTOS -->
            <div class="grid grid-cols-5 gap-1.5 mb-3">
                <button onclick="selectProduct('b19')" id="btn-b19" class="toy-btn h-11"><span class="text-lg">🚰</span><span class="text-[6px] font-black uppercase">R. 19L</span></button>
                <button onclick="selectProduct('b12')" id="btn-b12" class="toy-btn h-11"><span class="text-lg">💧</span><span class="text-[6px] font-black uppercase">R. 12L</span></button>
                <button onclick="selectProduct('b8')" id="btn-b8" class="toy-btn h-11"><span class="text-lg">🏺</span><span class="text-[6px] font-black uppercase">R. 8L</span></button>
                <button onclick="selectProduct('b5')" id="btn-b5" class="toy-btn h-11"><span class="text-lg">🥤</span><span class="text-[6px] font-black uppercase">B. 5L</span></button>
                <button onclick="openTapaModal()" id="btn-tapa" class="toy-btn h-11 btn-blue-outline"><span class="text-lg">🔘</span><span class="text-[6px] font-black uppercase">Tapa</span></button>
                <button onclick="selectProduct('hielo')" id="btn-hielo" class="toy-btn h-11 btn-blue-outline"><span class="text-lg">🧊</span><span class="text-[6px] font-black uppercase">Hielo</span></button>
                <button onclick="selectProduct('n19')" id="btn-n19" class="toy-btn h-11 btn-blue-outline"><span class="text-lg">✨</span><span class="text-[6px] font-black uppercase">N. 19L</span></button>
                <button onclick="selectProduct('n12')" id="btn-n12" class="toy-btn h-11 btn-blue-outline"><span class="text-lg">🌟</span><span class="text-[6px] font-black uppercase">N. 12L</span></button>
                <button onclick="selectProduct('mantenimiento')" id="btn-mantenimiento" class="toy-btn h-11 btn-maint"><span class="text-lg">🛠️</span><span class="text-[6px] font-black uppercase">Manten.</span></button>
                <button onclick="togglePromo()" id="btn-promo" class="toy-btn h-11 btn-promo"><span class="text-lg">📅</span><span class="text-[6px] font-black uppercase">Oferta</span></button>
            </div>
            
            <!-- TECLADO NUMÉRICO -->
            <div class="bg-blue-50/80 p-3 rounded-[2rem] border-2 border-blue-100 shadow-inner">
                <div class="numpad-grid mb-3">
                    <button onclick="appendQty(1)" class="toy-btn h-12 text-xl">1</button>
                    <button onclick="appendQty(2)" class="toy-btn h-12 text-xl">2</button>
                    <button onclick="appendQty(3)" class="toy-btn h-12 text-xl">3</button>
                    <button onclick="appendQty(4)" class="toy-btn h-12 text-xl">4</button>
                    <button onclick="appendQty(5)" class="toy-btn h-12 text-xl">5</button>
                    <button onclick="appendQty(6)" class="toy-btn h-12 text-xl">6</button>
                    <button onclick="appendQty(7)" class="toy-btn h-12 text-xl">7</button>
                    <button onclick="appendQty(8)" class="toy-btn h-12 text-xl">8</button>
                    <button onclick="appendQty(9)" class="toy-btn h-12 text-xl">9</button>
                    <button onclick="clearQty()" class="toy-btn h-12 text-sm text-rose-500 border-rose-200 font-black">C</button>
                    <button onclick="appendQty(0)" class="toy-btn h-12 text-xl">0</button>
                    <button onclick="addToCart()" class="toy-btn btn-blue-solid h-12 text-base">OK</button>
                </div>
                <div class="flex gap-2 w-full">
                    <button onclick="resetCart()" class="toy-btn w-1/3 py-2 text-[10px] font-black text-rose-400 border-rose-200 uppercase">Borrar</button>
                    <button onclick="openCheckout()" class="toy-btn btn-green-solid w-2/3 py-2 text-sm uppercase tracking-wider flex flex-row gap-2"><span>💸</span> COBRAR</button>
                </div>
            </div>
        </div>
        
        <!-- CARRITO -->
        <div id="cart-list" class="space-y-2 mt-4 pb-10">
            <div class="text-center p-8 text-slate-300 font-bold italic text-sm">Carrito vacío</div>
        </div>
    </section>

    <!-- MODAL DE SELECCIÓN DE TAPA -->
    <div id="tapa-modal" class="hidden fixed inset-0 z-[60] bg-slate-900/60 flex items-center justify-center p-4">
        <!-- (Contenido intacto) -->
        <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl transform transition-all text-center">
            <h3 class="text-lg font-black text-slate-800 mb-4 tracking-tight">Seleccionar Tipo</h3>
            <div class="space-y-3">
                <button onclick="selectTapaType('tapa')" class="w-full bg-blue-50 border-2 border-blue-200 text-blue-700 hover:bg-blue-100 font-black py-4 rounded-xl flex items-center justify-center gap-2 transition-colors active:scale-95 shadow-sm">
                    <span class="text-2xl">🔘</span> Tapa Sencilla
                </button>
                <button onclick="selectTapaType('tapa_aro')" class="w-full bg-indigo-50 border-2 border-indigo-200 text-indigo-700 hover:bg-indigo-100 font-black py-4 rounded-xl flex items-center justify-center gap-2 transition-colors active:scale-95 shadow-sm">
                    <span class="text-2xl">💠</span> Tapa con Aro
                </button>
            </div>
            <button onclick="closeTapaModal()" class="mt-4 text-xs font-bold text-slate-400 uppercase tracking-widest py-2 px-4 rounded-lg hover:bg-slate-50 transition-colors">Cancelar</button>
        </div>
    </div>

    <!-- MODAL DE REGISTRO DE NUEVO CLIENTE (NUEVO) -->
    <div id="new-customer-modal" class="hidden fixed inset-0 z-[70] bg-slate-900/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-black text-slate-800 mb-1">Nuevo Cliente</h3>
            <p class="text-xs text-slate-500 mb-4">La cédula no está registrada. Ingresa los datos para continuar.</p>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase">Cédula</label>
                    <input type="text" id="new-client-cedula" class="w-full bg-slate-100 border-2 border-slate-200 rounded-xl px-3 py-2 font-black text-slate-600 outline-none cursor-not-allowed" readonly>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase">Nombre y Apellido *</label>
                    <input type="text" id="new-client-nombre" class="w-full bg-white border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800 outline-none focus:border-blue-400" autocomplete="off">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase">Residencia (Ej. Villa Brasil)</label>
                    <input type="text" id="new-client-residencia" class="w-full bg-white border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800 outline-none focus:border-blue-400" autocomplete="off">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase">Teléfono</label>
                    <input type="tel" id="new-client-telefono" class="w-full bg-white border-2 border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800 outline-none focus:border-blue-400" autocomplete="off">
                </div>
            </div>
            <div class="flex gap-2 mt-5">
                <button onclick="closeNewCustomerModal()" class="w-1/3 py-3 text-xs font-black text-slate-500 border-2 border-slate-200 rounded-xl hover:bg-slate-50">Cancelar</button>
                <button onclick="saveNewCustomer()" id="btn-save-client" class="w-2/3 py-3 text-xs font-black text-white bg-blue-600 border-2 border-blue-700 rounded-xl shadow-md hover:bg-blue-700 transition-colors">Guardar y Usar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE COBRO ACTUALIZADO -->
    <div id="checkout-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex flex-col justify-end">
        <div class="bg-white rounded-t-3xl p-5 shadow-2xl transition-transform duration-300 translate-y-full max-h-[95vh] overflow-y-auto" id="checkout-content">
            
            <!-- HEADER CON BUSCADOR (MODIFICADO) -->
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-black text-slate-800 tracking-tight shrink-0 mr-2">Pagos</h2>
                <div class="flex flex-grow bg-slate-100 rounded-full p-1 border-2 border-slate-200">
                    <input type="number" id="search-cedula" placeholder="Buscar cédula..." class="w-full bg-transparent outline-none px-3 text-sm font-bold text-slate-700" autocomplete="off">
                    <button onclick="searchCustomer()" id="btn-search-client" class="bg-blue-500 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-blue-600 transition-colors shadow-sm shrink-0">
                        🔍
                    </button>
                </div>
                <button onclick="closeCheckout()" class="text-slate-400 font-bold text-lg px-2 py-1 bg-slate-100 rounded-full ml-2">✕</button>
            </div>

            <!-- INDICADOR DE CLIENTE SELECCIONADO -->
            <div id="customer-info" class="hidden mb-3 text-center transition-all">
                <span class="text-[11px] font-black text-emerald-700 bg-emerald-100 border-2 border-emerald-200 px-4 py-1.5 rounded-full inline-flex items-center gap-2">
                    👤 Cliente: <span id="customer-name-display" class="uppercase"></span>
                    <button onclick="clearCustomer()" class="text-rose-500 hover:text-rose-700 ml-1 bg-rose-100 rounded-full w-4 h-4 flex items-center justify-center">✖</button>
                </span>
            </div>
            
            <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-3 text-center mb-4">
                <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest block mb-1">Total del Ticket</span>
                <span id="co-total-display" class="text-4xl font-black text-blue-700 tracking-tighter">0,00</span>
                <span class="text-xs font-bold text-blue-500 ml-1">Bs.</span>
            </div>

            <!-- GRID PARA LOS MÉTODOS DE PAGO -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1"><span class="text-sm">💵</span> Efectivo (Bs)</label>
                    <input type="number" step="0.01" id="pay-cash" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-2 py-2 text-base font-black text-slate-800 outline-none focus:border-emerald-400 focus:bg-white transition-colors" placeholder="0" oninput="calculateChange()">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1"><span class="text-sm">💲</span> Divisas ($)</label>
                    <input type="number" step="0.01" id="pay-usd" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-2 py-2 text-base font-black text-slate-800 outline-none focus:border-green-400 focus:bg-white transition-colors" placeholder="0" oninput="calculateChange()">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1"><span class="text-sm">💳</span> Punto (Bs)</label>
                    <input type="number" step="0.01" id="pay-punto" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-2 py-2 text-base font-black text-slate-800 outline-none focus:border-indigo-400 focus:bg-white transition-colors" placeholder="0" oninput="calculateChange()">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1"><span class="text-sm">📱</span> Pago Móvil (Bs)</label>
                    <input type="number" step="0.01" id="pay-pagomovil" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-2 py-2 text-base font-black text-slate-800 outline-none focus:border-violet-400 focus:bg-white transition-colors" placeholder="0" oninput="calculateChange()">
                </div>
            </div>

            <div id="change-box" class="rounded-2xl p-4 text-center border-2 mb-4 bg-slate-100 border-slate-200">
                <span id="change-label" class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-1">Resta por Pagar</span>
                <span id="change-display" class="text-3xl font-black text-slate-800 tracking-tighter">0,00</span>
                <span class="text-xs font-bold ml-1">Bs.</span>
            </div>
            
            <!-- BOTÓN COMPLETAR (MODIFICADO CON ID Y DESHABILITADO POR DEFECTO) -->
            <button id="btn-complete-sale" disabled onclick="completeSale()" class="w-full toy-btn bg-slate-200 text-slate-400 border-slate-300 h-14 text-lg font-black uppercase tracking-widest cursor-not-allowed">
                🔒 BUSCAR CLIENTE PRIMERO
            </button>
        </div>
    </div>

    <script>
        window.roundBs = (num) => +(Math.round(num + "e+2")  + "e-2");
        let BS_PRICES = { b19: 230, b12: 180, b8: 90, b5: 80 };
        let USD_PRICES = { n19: 23, n12: 18.5, hielo: 2.5, mantenimiento: 3.5, tapa: 0.15, tapa_aro: 0.20 };
        
        const CODES = { b19: 8, b12: 4, b8: "X", b5: 2, n19: 6, n12: 5, hielo: 7, tapa: "X", tapa_aro: "COD_TAPA_ARO", mantenimiento: "M" };
        const COMBO_CODES = { b19_tapa: 3, b12_tapa: 1, b19_tapa_aro: "COD_19_ARO", b12_tapa_aro: "COD_12_ARO" };

        const API_URL_BASE = "https://script.google.com/macros/s/AKfycbz2wZCOD43miyMwO6S02zCXW2zyQHH-ERcMo_pCmORdX1smDn17mwAnZK35a1T0mimD/exec";
        const SECURITY_TOKEN = "Managua2026_Seguro_FirmaX";
        const API_URL_GET = `${API_URL_BASE}?token=${SECURITY_TOKEN}`;

        // ESTADO GLOBAL DEL CLIENTE ACTUAL
        let currentClient = null;

        async function sincronizarPrecios() {
            try {
                const response = await fetch(API_URL_GET);
                const preciosNube = await response.json();
                
                if(preciosNube.b19) BS_PRICES.b19 = preciosNube.b19;
                if(preciosNube.b12) BS_PRICES.b12 = preciosNube.b12;
                if(preciosNube.b8) BS_PRICES.b8 = preciosNube.b8;
                if(preciosNube.b5) BS_PRICES.b5 = preciosNube.b5;
                if(preciosNube.n19) USD_PRICES.n19 = preciosNube.n19;
                if(preciosNube.n12) USD_PRICES.n12 = preciosNube.n12;
                if(preciosNube.hielo) USD_PRICES.hielo = preciosNube.hielo;
                if(preciosNube.mantenimiento) USD_PRICES.mantenimiento = preciosNube.mantenimiento;
                if(preciosNube.tapa) USD_PRICES.tapa = preciosNube.tapa;
                if(preciosNube.tapa_aro) USD_PRICES.tapa_aro = preciosNube.tapa_aro; 

                if(preciosNube.tasa_bcv) {
                    const cleanRate = preciosNube.tasa_bcv.toString().replace('.', ',');
                    document.getElementById('bcv-rate').value = cleanRate;
                    updateTasaLabel("Tasa Oficial", "text-emerald-500");
                    localStorage.setItem('MANAGUA_BCV_RATE', preciosNube.tasa_bcv);
                }
                renderCart();
            } catch (error) {
                console.warn("⚠️ Usando datos locales de emergencia.");
                const savedRate = localStorage.getItem('MANAGUA_BCV_RATE');
                if(savedRate) {
                    document.getElementById('bcv-rate').value = savedRate.toString().replace('.', ',');
                    updateTasaLabel("Modo Offline", "text-rose-500");
                    renderCart();
                }
            } finally {
                const loader = document.getElementById('loader-pos');
                if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }
            }
        }

        sincronizarPrecios();

        let calcState = { qty: "", product: null, promo: false, cart: { b19:0, b12:0, b8:0, b5:0, n19:0, n12:0, hielo:0, tapa:0, tapa_aro:0, mantenimiento:0 }, currentTotal: 0 };

        window.onload = () => { if (new Date().getDay() === 4) togglePromo(true); };

        function updateTasaLabel(t, c) { 
            const l = document.getElementById('tasa-label'); l.innerText = t; l.className = `text-[8px] font-black uppercase mb-1 ${c}`; 
        }

        window.openTapaModal = () => { document.getElementById('tapa-modal').classList.remove('hidden'); };
        window.closeTapaModal = () => { document.getElementById('tapa-modal').classList.add('hidden'); };
        window.selectTapaType = (type) => {
            closeTapaModal();
            calcState.product = type; 
            document.querySelectorAll('.toy-btn').forEach(b => { if(b.id !== 'btn-promo') b.classList.remove('btn-active'); });
            const btnTapa = document.getElementById('btn-tapa');
            btnTapa.classList.add('btn-active');
            const textSpan = btnTapa.querySelector('span:nth-child(2)');
            textSpan.innerText = type === 'tapa_aro' ? 'T. ARO' : 'TAPA';
        };

        window.selectProduct = (id) => {
            calcState.product = id;
            document.querySelectorAll('.toy-btn').forEach(b => { if(b.id !== 'btn-promo') b.classList.remove('btn-active'); });
            const target = document.getElementById(`btn-${id}`);
            if(target) target.classList.add('btn-active');
            document.querySelector('#btn-tapa span:nth-child(2)').innerText = 'TAPA';
        };
        
        window.appendQty = (n) => { if(calcState.qty.length < 3) calcState.qty += n; document.getElementById('qty-display').innerText = calcState.qty || "1"; };
        window.clearQty = () => { calcState.qty = ""; document.getElementById('qty-display').innerText = "1"; };
        window.togglePromo = (force = null) => { 
            calcState.promo = force !== null ? force : !calcState.promo; 
            const btn = document.getElementById('btn-promo');
            if(btn) btn.classList.toggle('btn-promo-active', calcState.promo); 
            renderCart(); 
        };
        
        window.resetCart = () => { calcState.cart = { b19:0, b12:0, b8:0, b5:0, n19:0, n12:0, hielo:0, tapa:0, tapa_aro:0, mantenimiento:0 }; renderCart(); };
        window.addToCart = () => { 
            if(!calcState.product) return; 
            calcState.cart[calcState.product] += parseInt(calcState.qty) || 1; 
            window.clearQty(); 
            renderCart(); 
        };

        window.renderCart = () => {
            const list = document.getElementById('cart-list');
            const rateInput = document.getElementById('bcv-rate').value;
            const rate = parseFloat(rateInput.replace(',', '.')) || 0;
            let totalBs = 0; let itemsUI = []; let tempCart = { ...calcState.cart };
            
            const tapaPriceBs = window.roundBs(USD_PRICES.tapa * rate);
            const tapaAroPriceBs = window.roundBs(USD_PRICES.tapa_aro * rate); 
            
            let tapasRestantes = tempCart.tapa; let tapasAroRestantes = tempCart.tapa_aro;
            
            ['b19', 'b12'].forEach(b => {
                let combos = Math.min(tempCart[b], tapasRestantes);
                if(combos > 0) {
                    const priceCombo = window.roundBs(BS_PRICES[b] + tapaPriceBs);
                    const sub = window.roundBs(combos * priceCombo);
                    totalBs = window.roundBs(totalBs + sub);
                    itemsUI.push({ name: `${b.slice(1)}L + Tapa`, qty: combos, price: priceCombo, sub: sub, code: COMBO_CODES[`${b}_tapa`] });
                    tempCart[b] -= combos; tapasRestantes -= combos;
                }
                let combosAro = Math.min(tempCart[b], tapasAroRestantes);
                if(combosAro > 0) {
                    const priceComboAro = window.roundBs(BS_PRICES[b] + tapaAroPriceBs);
                    const sub = window.roundBs(combosAro * priceComboAro);
                    totalBs = window.roundBs(totalBs + sub);
                    itemsUI.push({ name: `${b.slice(1)}L + T. Aro`, qty: combosAro, price: priceComboAro, sub: sub, code: COMBO_CODES[`${b}_tapa_aro`] });
                    tempCart[b] -= combosAro; tapasAroRestantes -= combosAro;
                }
            });

            let p19 = tempCart.b19; let paid19 = p19; let saved19 = 0;
            if(calcState.promo && p19 >= 4) {
                saved19 = Math.floor(p19 / 4); paid19 -= saved19;
                document.getElementById('promo-banner').classList.remove('hidden');
                document.getElementById('promo-msg').innerText = `OFERTA JUEVES: Paga ${p19 - saved19} de ${p19} botellones (Ahorras ${saved19})`;
            } else { document.getElementById('promo-banner').classList.add('hidden'); }

            if(p19 > 0) {
                const sub = window.roundBs(paid19 * BS_PRICES.b19); totalBs = window.roundBs(totalBs + sub);
                itemsUI.push({ name: "Recarga 19L", qty: p19, price: BS_PRICES.b19, sub: sub, code: CODES.b19 });
            }

            ['b12', 'b8', 'b5'].forEach(k => { if(tempCart[k]>0){
                const sub = window.roundBs(tempCart[k]*BS_PRICES[k]); totalBs = window.roundBs(totalBs+sub);
                itemsUI.push({ name: `Recarga ${k.slice(1)}L`, qty: tempCart[k], price: BS_PRICES[k], sub: sub, code: CODES[k] });
            }});

            if(tapasRestantes > 0) {
                const sub = window.roundBs(tapasRestantes * tapaPriceBs); totalBs = window.roundBs(totalBs+sub);
                itemsUI.push({ name: "Tapa Sencilla", qty: tapasRestantes, price: tapaPriceBs, sub: sub, code: CODES.tapa });
            }
            if(tapasAroRestantes > 0) {
                const sub = window.roundBs(tapasAroRestantes * tapaAroPriceBs); totalBs = window.roundBs(totalBs+sub);
                itemsUI.push({ name: "Tapa con Aro", qty: tapasAroRestantes, price: tapaAroPriceBs, sub: sub, code: CODES.tapa_aro });
            }

            ['n19', 'n12', 'hielo', 'mantenimiento'].forEach(k => { if(tempCart[k]>0){
                const priceBs = window.roundBs(USD_PRICES[k] * rate); const sub = window.roundBs(tempCart[k] * priceBs); totalBs = window.roundBs(totalBs + sub);
                itemsUI.push({ name: k === 'mantenimiento' ? 'Manten.' : k.toUpperCase(), qty: tempCart[k], price: priceBs, sub: sub, code: CODES[k] });
            }});

            calcState.currentTotal = totalBs;
            document.getElementById('total-display').innerText = totalBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            list.innerHTML = itemsUI.map(i => `
                <div class="flex justify-between bg-white p-3 rounded-2xl shadow-sm mx-1">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-600 text-white w-7 h-7 rounded-lg flex items-center justify-center font-black text-[10px]">${i.code}</div>
                        <div><div class="font-black text-slate-700 text-[11px]">${i.qty}x ${i.name}</div><div class="text-[8px] text-slate-400 font-black uppercase">Bs. ${i.price.toLocaleString('es-VE')}</div></div>
                    </div>
                    <span class="font-black text-slate-800 text-xs my-auto">Bs. ${i.sub.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                </div>`).join('') || '<div class="text-center p-8 text-slate-300 italic text-sm">Carrito vacío</div>';
        };

        // MANEJO DE ESTADOS DEL BOTON COMPLETAR
        window.disableCompleteBtn = () => {
            const btn = document.getElementById('btn-complete-sale');
            btn.disabled = true;
            btn.className = "w-full toy-btn bg-slate-200 text-slate-400 border-slate-300 h-14 text-lg font-black uppercase tracking-widest cursor-not-allowed";
            btn.innerHTML = '🔒 BUSCAR CLIENTE PRIMERO';
        };

        window.enableCompleteBtn = () => {
            const btn = document.getElementById('btn-complete-sale');
            btn.disabled = false;
            btn.className = "w-full toy-btn btn-green-solid h-14 text-lg font-black uppercase tracking-widest";
            btn.innerHTML = '✅ Completar Venta';
        };

        // AL ABRIR EL CHECKOUT, REINICIAMOS EL CLIENTE
        window.openCheckout = () => { 
            if(calcState.currentTotal === 0) return;
            
            clearCustomer(); // Limpiamos cliente previo
            document.getElementById('checkout-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('checkout-content').classList.remove('translate-y-full'), 10);
            document.getElementById('co-total-display').innerText = calcState.currentTotal.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            calculateChange();
        };

        window.closeCheckout = () => {
            document.getElementById('checkout-content').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('checkout-modal').classList.add('hidden'), 300);
        };

        window.calculateChange = () => {
            const total = calcState.currentTotal;
            const rateInput = document.getElementById('bcv-rate').value;
            const rate = parseFloat(rateInput.replace(',', '.')) || 0;
            const cash = parseFloat(document.getElementById('pay-cash').value) || 0;
            const usd = parseFloat(document.getElementById('pay-usd').value) || 0;
            const punto = parseFloat(document.getElementById('pay-punto').value) || 0;
            const pm = parseFloat(document.getElementById('pay-pagomovil').value) || 0;

            const usdToBs = window.roundBs(usd * rate);
            const paid = window.roundBs(cash + punto + pm + usdToBs);
            const diff = window.roundBs(paid - total);
            
            const box = document.getElementById('change-box');
            const disp = document.getElementById('change-display');
            const lbl = document.getElementById('change-label');
            
            if(diff < 0) { 
                box.className = "rounded-2xl p-4 border-2 mb-4 bg-rose-50 border-rose-200 text-center"; 
                disp.innerText = Math.abs(diff).toLocaleString('es-VE', {minimumFractionDigits:2}); 
                lbl.innerText = "Resta por Pagar";
            } else { 
                box.className = "rounded-2xl p-4 border-2 mb-4 bg-emerald-50 border-emerald-200 text-center"; 
                disp.innerText = diff.toLocaleString('es-VE', {minimumFractionDigits:2}); 
                lbl.innerText = "Vuelto a Entregar (Bs)";
            }
        };

        // ==========================================
        // NUEVAS FUNCIONES DE CLIENTES
        // ==========================================
        window.clearCustomer = () => {
            currentClient = null;
            document.getElementById('search-cedula').value = "";
            document.getElementById('customer-info').classList.add('hidden');
            disableCompleteBtn();
        };

        window.searchCustomer = async () => {
            const cedula = document.getElementById('search-cedula').value.trim();
            if(!cedula) return alert("⚠️ Ingresa una cédula para buscar.");

            const btn = document.getElementById('btn-search-client');
            btn.innerHTML = "⏳"; btn.disabled = true;

            try {
                // Se hace una petición GET para buscar el cliente
                const response = await fetch(`${API_URL_GET}&action=searchClient&cedula=${cedula}`);
                const data = await response.json();

                if(data.found) {
                    currentClient = data.client;
                    document.getElementById('customer-name-display').innerText = currentClient.nombre;
                    document.getElementById('customer-info').classList.remove('hidden');
                    enableCompleteBtn();
                } else {
                    // No existe, abrimos modal para registrarlo
                    document.getElementById('new-client-cedula').value = cedula;
                    document.getElementById('new-client-nombre').value = "";
                    document.getElementById('new-client-residencia').value = "";
                    document.getElementById('new-client-telefono').value = "";
                    document.getElementById('new-customer-modal').classList.remove('hidden');
                }
            } catch (e) {
                alert("⚠️ Error de conexión al buscar cliente.");
                console.error(e);
            } finally {
                btn.innerHTML = "🔍"; btn.disabled = false;
            }
        };

        window.closeNewCustomerModal = () => { document.getElementById('new-customer-modal').classList.add('hidden'); };

        window.saveNewCustomer = async () => {
            const cedula = document.getElementById('new-client-cedula').value;
            const nombre = document.getElementById('new-client-nombre').value.trim();
            const residencia = document.getElementById('new-client-residencia').value.trim();
            const telefono = document.getElementById('new-client-telefono').value.trim();

            if(!nombre) return alert("⚠️ El Nombre es obligatorio.");

            const btn = document.getElementById('btn-save-client');
            btn.innerHTML = "Guardando..."; btn.disabled = true;

            const payload = { token: SECURITY_TOKEN, action: "registerClient", cedula, nombre, residencia, telefono };

            try {
                await fetch(API_URL_BASE, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                // Al usar no-cors, asumimos que se guardó correctamente para fluidez de caja
                currentClient = { cedula, nombre };
                document.getElementById('customer-name-display').innerText = currentClient.nombre;
                document.getElementById('customer-info').classList.remove('hidden');
                enableCompleteBtn();
                closeNewCustomerModal();
            } catch(e) {
                alert("⚠️ Error al guardar el cliente.");
            } finally {
                btn.innerHTML = "Guardar y Usar"; btn.disabled = false;
            }
        };

        // COMPLETAR VENTA (MODIFICADO PARA ENVIAR CLIENTE)
        window.completeSale = async () => { 
            if(calcState.currentTotal === 0 || !currentClient) return;

            let itemsVendidos = [];
            for (const [key, value] of Object.entries(calcState.cart)) {
                if (value > 0) itemsVendidos.push(`${value}x ${key.toUpperCase()}`);
            }
            const detalleVenta = itemsVendidos.join(" + ");

            const cash = parseFloat(document.getElementById('pay-cash').value) || 0;
            const usd = parseFloat(document.getElementById('pay-usd').value) || 0;
            const punto = parseFloat(document.getElementById('pay-punto').value) || 0;
            const pm = parseFloat(document.getElementById('pay-pagomovil').value) || 0;

            const payload = {
                token: SECURITY_TOKEN,
                action: "registerSale",
                detalle: detalleVenta,
                efectivo: cash,
                dolares: usd,
                punto: punto,
                pagoMovil: pm,
                total: calcState.currentTotal,
                clienteNombre: currentClient.nombre, // ¡Dato nuevo!
                clienteCedula: currentClient.cedula  // ¡Dato nuevo!
            };

            const btn = document.getElementById('btn-complete-sale');
            btn.innerHTML = '⏳ REGISTRANDO...'; btn.disabled = true;

            try {
                await fetch(API_URL_BASE, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                resetCart(); 
                closeCheckout(); 
                document.getElementById('pay-cash').value = ""; 
                document.getElementById('pay-usd').value = "";
                document.getElementById('pay-punto').value = "";
                document.getElementById('pay-pagomovil').value = ""; 
                
            } catch (e) {
                alert("⚠️ Ocurrió un error de red. Verifica la conexión.");
            } finally {
                btn.innerHTML = '✅ Completar Venta'; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
